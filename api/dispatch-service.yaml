components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateDispatch:
      type: object
      additionalProperties: false
      required:
      - incidentId
      - teamId
      properties:
        incidentId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
      example: *id002
    Dispatch:
      type: object
      additionalProperties: false
      required:
      - id
      - incidentId
      - teamId
      - status
      - acceptBy
      - version
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PREPARING
          - AWAITING_ACCEPTANCE
          - CONFIRMING
          - ACTIVE
          - CANCELLING
          - CANCELLED
          - COMPLETED
        acceptBy:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      example: *id001
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          format: uuid
      example:
        type: https://example.com/problems/conflict
        title: Конфликт состояния
        status: 409
        detail: Переход из текущего состояния запрещён
        instance: /api/v1/dispatches/11111111-1111-4111-8111-111111111111
        traceId: 11111111-1111-4111-8111-111111111111
    DispatchList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dispatch'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    DispatchConfirmed:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - aggregateVersion
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - dispatch.confirmed
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: false
          required:
          - dispatchId
          - incidentId
          - teamId
          - recipientUserId
          properties:
            dispatchId:
              type: string
              format: uuid
            incidentId:
              type: string
              format: uuid
            teamId:
              type: string
              format: uuid
            recipientUserId:
              type: string
              format: uuid
      description: Событие через RabbitMQ; ACK после локальной транзакции.
      x-exchange: city.events
      x-routing-key: dispatch.confirmed
      x-publisher: dispatch-service
      x-subscribers:
      - operation-service
      - notification-service
      example:
        eventId: 11111111-1111-4111-8111-111111111111
        eventType: dispatch.confirmed
        occurredAt: '2026-10-30T16:00:00Z'
        schemaVersion: 1
        correlationId: 11111111-1111-4111-8111-111111111111
        aggregateVersion: 1
        payload:
          dispatchId: 11111111-1111-4111-8111-111111111111
          incidentId: 11111111-1111-4111-8111-111111111111
          teamId: 11111111-1111-4111-8111-111111111111
          recipientUserId: 11111111-1111-4111-8111-111111111111
    DispatchCancelled:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - aggregateVersion
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - dispatch.cancelled
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: false
          required:
          - dispatchId
          - incidentId
          - recipientUserId
          - reason
          properties:
            dispatchId:
              type: string
              format: uuid
            incidentId:
              type: string
              format: uuid
            recipientUserId:
              type: string
              format: uuid
            reason:
              type: string
      description: Событие через RabbitMQ; ACK после локальной транзакции.
      x-exchange: city.events
      x-routing-key: dispatch.cancelled
      x-publisher: dispatch-service
      x-subscribers:
      - notification-service
      example:
        eventId: 11111111-1111-4111-8111-111111111111
        eventType: dispatch.cancelled
        occurredAt: '2026-10-30T16:00:00Z'
        schemaVersion: 1
        correlationId: 11111111-1111-4111-8111-111111111111
        aggregateVersion: 1
        payload:
          dispatchId: 11111111-1111-4111-8111-111111111111
          incidentId: 11111111-1111-4111-8111-111111111111
          recipientUserId: 11111111-1111-4111-8111-111111111111
          reason: ACCEPTANCE_TIMEOUT
    DispatchCompleted:
      type: object
