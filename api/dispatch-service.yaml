        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - dispatch.completed
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: false
          required:
          - dispatchId
          - incidentId
          - recipientUserId
          properties:
            dispatchId:
              type: string
              format: uuid
            incidentId:
              type: string
              format: uuid
            recipientUserId:
              type: string
              format: uuid
      description: Событие через RabbitMQ; ACK после локальной транзакции.
      x-exchange: city.events
      x-routing-key: dispatch.completed
      x-publisher: dispatch-service
      x-subscribers:
      - incident-service
      - notification-service
      example:
        eventId: 11111111-1111-4111-8111-111111111111
        eventType: dispatch.completed
        occurredAt: '2026-10-30T16:00:00Z'
        schemaVersion: 1
        correlationId: 11111111-1111-4111-8111-111111111111
        aggregateVersion: 1
        payload:
          dispatchId: 11111111-1111-4111-8111-111111111111
          incidentId: 11111111-1111-4111-8111-111111111111
          recipientUserId: 11111111-1111-4111-8111-111111111111
