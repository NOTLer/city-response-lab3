  /api/v1/dispatches/{id}/cancel:
    post:
      tags:
      - public
      operationId: cancelDispatch
      summary: Запросить отмену назначения
      description: Роль dispatcher. PREPARING, AWAITING_ACCEPTANCE или CONFIRMING
        → CANCELLING. ACTIVE и COMPLETED → 409. Если подтверждение уже зафиксировано,
        отмена отклоняется. Повтор CANCELLED возвращает текущее состояние.
      parameters:
      - name: id
        in: path
        required: true
        description: UUID объекта
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID операции. Ключ связан с caller, method, path и хэшем тела;
          другое тело с тем же ключом → 409. Хранить ответ минимум 7 суток; бизнес-уникальность
          dispatchId бессрочна.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '202':
          description: Операция принята для фонового выполнения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispatch'
              example: *id001
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/400
                title: Некорректный запрос
                status: 400
                detail: Некорректный запрос
                instance: /api/v1/dispatches/11111111-1111-4111-8111-111111111111/cancel
                traceId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Требуется авторизация
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/401
                title: Требуется авторизация
                status: 401
                detail: Требуется авторизация
                instance: /api/v1/dispatches/11111111-1111-4111-8111-111111111111/cancel
                traceId: 11111111-1111-4111-8111-111111111111
        '403':
