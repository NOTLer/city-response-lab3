components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateIncident:
      type: object
      additionalProperties: false
      required:
      - kind
      - address
      - description
      - priority
      properties:
        kind:
          type: string
          enum:
          - GAS_LEAK
          - FLOOD
          - FALLEN_TREE
        address:
          type: string
          minLength: 3
          maxLength: 300
        description:
          type: string
          minLength: 1
          maxLength: 2000
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      example: *id002
    Incident:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - address
      - description
      - priority
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - GAS_LEAK
          - FLOOD
          - FALLEN_TREE
        address:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        createdAt:
          type: string
          format: date-time
      example: *id001
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          format: uuid
      example:
        type: https://example.com/problems/conflict
        title: Конфликт состояния
        status: 409
        detail: Переход из текущего состояния запрещён
        instance: /api/v1/dispatches/11111111-1111-4111-8111-111111111111
        traceId: 11111111-1111-4111-8111-111111111111
    IncidentList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    IncidentCreated:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - aggregateVersion
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - incident.created
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: false
          required:
          - incidentId
          - priority
          properties:
            incidentId:
              type: string
              format: uuid
            priority:
              type: string
              enum:
              - LOW
              - MEDIUM
              - HIGH
      description: Событие через RabbitMQ; ACK после локальной транзакции.
      x-exchange: city.events
      x-routing-key: incident.created
      x-publisher: incident-service
      x-subscribers:
      - dispatch-service
      example:
        eventId: 11111111-1111-4111-8111-111111111111
        eventType: incident.created
        occurredAt: '2026-10-30T16:00:00Z'
        schemaVersion: 1
        correlationId: 11111111-1111-4111-8111-111111111111
        aggregateVersion: 1
        payload:
          incidentId: 11111111-1111-4111-8111-111111111111
          priority: HIGH
