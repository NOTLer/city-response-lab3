components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Preferences:
      type: object
      additionalProperties: false
      required:
      - email
      - enabled
      properties:
        email:
          type: string
          format: email
        enabled:
          type: boolean
      example: *id001
    Notification:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - dispatchId
      - eventType
      - status
      - attempts
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        dispatchId:
          type: string
          format: uuid
        eventType:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
        attempts:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      example: *id002
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          format: uuid
      example:
        type: https://example.com/problems/conflict
        title: Конфликт состояния
        status: 409
        detail: Переход из текущего состояния запрещён
        instance: /api/v1/dispatches/11111111-1111-4111-8111-111111111111
        traceId: 11111111-1111-4111-8111-111111111111
    NotificationList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
