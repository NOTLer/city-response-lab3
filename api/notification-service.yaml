  /api/v1/notifications/{id}/retry:
    post:
      tags:
      - public
      operationId: retryNotification
      summary: Повторить неудавшуюся доставку
      description: Только владелец записи. FAILED → PENDING; SENT → 409. Успех отправки
        не меняет состояние назначения.
      parameters:
      - name: id
        in: path
        required: true
        description: UUID объекта
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID операции. Ключ связан с caller, method, path и хэшем тела;
          другое тело с тем же ключом → 409. Хранить ответ минимум 7 суток; бизнес-уникальность
          dispatchId бессрочна.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '202':
          description: Операция принята для фонового выполнения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example: *id002
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/400
                title: Некорректный запрос
                status: 400
                detail: Некорректный запрос
                instance: /api/v1/notifications/11111111-1111-4111-8111-111111111111/retry
                traceId: 11111111-1111-4111-8111-111111111111
        '401':
