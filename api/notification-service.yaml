  /api/v1/notifications:
    get:
      tags:
      - public
      operationId: listNotifications
      summary: Получить историю своих уведомлений
      description: 'Только собственные записи по sub JWT. Подписчик событий уведомляет
        создателя назначения: recipientUserId берётся из доверенного события dispatch.'
      parameters:
      - name: page
        in: query
        description: Номер страницы
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        description: Размер страницы
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
              example:
                items:
                - &id002
                  id: 11111111-1111-4111-8111-111111111111
                  userId: 11111111-1111-4111-8111-111111111111
                  dispatchId: 11111111-1111-4111-8111-111111111111
                  eventType: dispatch.confirmed
                  status: PENDING
                  attempts: 1
                  createdAt: '2026-10-30T16:00:00Z'
                page: 1
                size: 20
                total: 1
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/400
                title: Некорректный запрос
                status: 400
