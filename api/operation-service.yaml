openapi: 3.0.3
info:
  title: operation-service
  version: 1.0.0
  description: Контракт учебной системы City Response. Public — только через Gateway;
    internal — только service JWT. Ошибки application/problem+json. См. README для
    саги и политик повторов.
servers:
- url: http://localhost:8080
  description: Учебный API Gateway; внутренние маршруты здесь закрыты
tags:
- name: public
  description: Клиентский API через Gateway
- name: internal
  description: Межсервисный API в закрытой сети
security:
- bearerAuth: []
paths:
  /internal/v1/operations/{dispatchId}:
    put:
      tags:
      - internal
      operationId: createOperation
      summary: Создать предложение работы бригаде
      description: Только dispatch-service. UNIQUE dispatchId. Повтор с тем же телом
        возвращает 200; другое тело → 409. CANCELLED tombstone запрещает позднее создание.
      parameters:
      - name: dispatchId
        in: path
        required: true
        description: UUID объекта
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID операции. Ключ связан с caller, method, path и хэшем тела;
          другое тело с тем же ключом → 409. Хранить ответ минимум 7 суток; бизнес-уникальность
          dispatchId бессрочна.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '201':
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example: &id001
                dispatchId: 11111111-1111-4111-8111-111111111111
                incidentId: 11111111-1111-4111-8111-111111111111
                teamId: 11111111-1111-4111-8111-111111111111
                status: ON_SITE
                address: Учебный город, улица Примерная, 10
                acceptBy: '2026-10-30T16:02:00Z'
                version: 1
        '200':
          description: Объект уже создан с теми же параметрами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                dispatchId: 11111111-1111-4111-8111-111111111111
                incidentId: 11111111-1111-4111-8111-111111111111
                teamId: 11111111-1111-4111-8111-111111111111
                status: OFFERED
                address: Учебный город, улица Примерная, 10
                acceptBy: '2026-10-30T16:02:00Z'
                version: 1
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/400
                title: Некорректный запрос
                status: 400
                detail: Некорректный запрос
                instance: /internal/v1/operations/11111111-1111-4111-8111-111111111111
                traceId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Требуется авторизация
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/401
                title: Требуется авторизация
                status: 401
                detail: Требуется авторизация
                instance: /internal/v1/operations/11111111-1111-4111-8111-111111111111
                traceId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Недостаточно прав
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/403
                title: Недостаточно прав
                status: 403
                detail: Недостаточно прав
                instance: /internal/v1/operations/11111111-1111-4111-8111-111111111111
                traceId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Объект не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/404
                title: Объект не найден
                status: 404
                detail: Объект не найден
                instance: /internal/v1/operations/11111111-1111-4111-8111-111111111111
                traceId: 11111111-1111-4111-8111-111111111111
        '409':
          description: Конфликт состояния или Idempotency-Key
