  /internal/v1/operations/{dispatchId}/cancel:
    post:
      tags:
      - internal
      operationId: cancelOperation
      summary: Отменить предложение до активации
      description: Только dispatch-service. OFFERED или ACCEPTED → CANCELLED; повтор
        безопасен. Для отсутствующего объекта записывает tombstone и возвращает 204.
        ACTIVE, ON_SITE, COMPLETED → 409; резерв тогда не освобождается.
      parameters:
      - name: dispatchId
        in: path
        required: true
        description: UUID объекта
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID операции. Ключ связан с caller, method, path и хэшем тела;
          другое тело с тем же ключом → 409. Хранить ответ минимум 7 суток; бизнес-уникальность
          dispatchId бессрочна.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example: *id001
        '204':
          description: Создана tombstone для ещё отсутствующего объекта; тело отсутствует
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/400
                title: Некорректный запрос
                status: 400
                detail: Некорректный запрос
                instance: /internal/v1/operations/11111111-1111-4111-8111-111111111111/cancel
                traceId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Требуется авторизация
