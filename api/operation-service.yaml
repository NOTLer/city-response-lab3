components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOperation:
      type: object
      additionalProperties: false
      required:
      - incidentId
      - teamId
      - address
      - acceptBy
      properties:
        incidentId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        address:
          type: string
        acceptBy:
          type: string
          format: date-time
      example: *id002
    Operation:
      type: object
      additionalProperties: false
      required:
      - dispatchId
      - incidentId
      - teamId
      - status
      - address
      - acceptBy
      - version
      properties:
        dispatchId:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - OFFERED
          - ACCEPTED
          - ACTIVE
          - ON_SITE
          - COMPLETED
          - CANCELLED
        address:
          type: string
        acceptBy:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      example: *id001
    Decision:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ACCEPT
          - REJECT
      example: *id003
    Report:
      type: object
      additionalProperties: false
      required:
      - status
      - note
      properties:
        status:
          type: string
          enum:
          - ON_SITE
          - COMPLETED
        note:
          type: string
          minLength: 1
          maxLength: 2000
      example: *id004
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          format: uuid
      example:
        type: https://example.com/problems/conflict
        title: Конфликт состояния
        status: 409
        detail: Переход из текущего состояния запрещён
        instance: /api/v1/dispatches/11111111-1111-4111-8111-111111111111
        traceId: 11111111-1111-4111-8111-111111111111
    OperationList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    OperationAccepted:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - aggregateVersion
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - operation.accepted
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: false
          required:
          - dispatchId
          - teamId
          properties:
            dispatchId:
              type: string
              format: uuid
            teamId:
              type: string
              format: uuid
      description: Событие через RabbitMQ; ACK после локальной транзакции.
      x-exchange: city.events
      x-routing-key: operation.accepted
      x-publisher: operation-service
      x-subscribers:
      - dispatch-service
      example:
        eventId: 11111111-1111-4111-8111-111111111111
        eventType: operation.accepted
        occurredAt: '2026-10-30T16:00:00Z'
        schemaVersion: 1
        correlationId: 11111111-1111-4111-8111-111111111111
        aggregateVersion: 1
        payload:
          dispatchId: 11111111-1111-4111-8111-111111111111
          teamId: 11111111-1111-4111-8111-111111111111
    OperationRejected:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - aggregateVersion
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - operation.rejected
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: false
          required:
          - dispatchId
          - teamId
          properties:
            dispatchId:
              type: string
              format: uuid
            teamId:
              type: string
              format: uuid
      description: Событие через RabbitMQ; ACK после локальной транзакции.
      x-exchange: city.events
      x-routing-key: operation.rejected
      x-publisher: operation-service
      x-subscribers:
      - dispatch-service
      example:
        eventId: 11111111-1111-4111-8111-111111111111
        eventType: operation.rejected
        occurredAt: '2026-10-30T16:00:00Z'
        schemaVersion: 1
        correlationId: 11111111-1111-4111-8111-111111111111
        aggregateVersion: 1
        payload:
          dispatchId: 11111111-1111-4111-8111-111111111111
          teamId: 11111111-1111-4111-8111-111111111111
    OperationCompleted:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - occurredAt
      - schemaVersion
      - correlationId
      - aggregateVersion
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - operation.completed
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          enum:
          - 1
        correlationId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: false
          required:
          - dispatchId
          - teamId
          - note
          properties:
            dispatchId:
              type: string
              format: uuid
            teamId:
              type: string
              format: uuid
            note:
              type: string
      description: Событие через RabbitMQ; ACK после локальной транзакции.
      x-exchange: city.events
      x-routing-key: operation.completed
      x-publisher: operation-service
      x-subscribers:
      - dispatch-service
      example:
        eventId: 11111111-1111-4111-8111-111111111111
        eventType: operation.completed
        occurredAt: '2026-10-30T16:00:00Z'
        schemaVersion: 1
        correlationId: 11111111-1111-4111-8111-111111111111
        aggregateVersion: 1
