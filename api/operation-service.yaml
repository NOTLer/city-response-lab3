    post:
      tags:
      - public
      operationId: decideOperation
      summary: Принять или отклонить предложение
      description: 'Только назначенная team. ACCEPT: OFFERED → ACCEPTED и operation.accepted;
        REJECT: OFFERED → CANCELLED и operation.rejected. После acceptBy → 409. Принятие
        ещё не разрешает выезд: необходимо дождаться ACTIVE. Поздний повтор не воскрешает
        CANCELLED.'
      parameters:
      - name: dispatchId
        in: path
        required: true
        description: UUID объекта
        schema:
          type: string
