        все. Пагинация после фильтрации доступа.
      parameters:
      - name: page
        in: query
        description: Номер страницы
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        description: Размер страницы
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationList'
              example:
                items:
                - *id001
                page: 1
                size: 20
                total: 1
        '400':
