  /api/v1/operations/{dispatchId}/reports:
    post:
      tags:
      - public
      operationId: reportOperation
      summary: Зафиксировать прибытие или завершение
      description: Только назначенная team. ACTIVE → ON_SITE → COMPLETED. При COMPLETED
        публикует operation.completed с итогом. Некорректный переход → 409. История
        отчётов сохраняется локально.
      parameters:
      - name: dispatchId
        in: path
        required: true
        description: UUID объекта
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID операции. Ключ связан с caller, method, path и хэшем тела;
          другое тело с тем же ключом → 409. Хранить ответ минимум 7 суток; бизнес-уникальность
          dispatchId бессрочна.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
