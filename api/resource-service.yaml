      - internal
      operationId: releaseReservation
      summary: Освободить резерв
      description: Только dispatch-service. HELD или CONFIRMED → RELEASED. Если резерв
        ещё не существует, записывает терминальную tombstone по dispatchId, возвращает
        204; поздний reserve отклоняется 409.
      parameters:
      - name: dispatchId
        in: path
        required: true
        description: UUID объекта
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID операции. Ключ связан с caller, method, path и хэшем тела;
          другое тело с тем же ключом → 409. Хранить ответ минимум 7 суток; бизнес-уникальность
          dispatchId бессрочна.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example: *id002
        '204':
          description: Создана tombstone для ещё отсутствующего объекта; тело отсутствует
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/400
                title: Некорректный запрос
                status: 400
                detail: Некорректный запрос
                instance: /internal/v1/reservations/11111111-1111-4111-8111-111111111111/release
                traceId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Требуется авторизация
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/401
                title: Требуется авторизация
                status: 401
                detail: Требуется авторизация
                instance: /internal/v1/reservations/11111111-1111-4111-8111-111111111111/release
                traceId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Недостаточно прав
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/403
                title: Недостаточно прав
                status: 403
                detail: Недостаточно прав
                instance: /internal/v1/reservations/11111111-1111-4111-8111-111111111111/release
                traceId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Объект не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/404
                title: Объект не найден
                status: 404
                detail: Объект не найден
                instance: /internal/v1/reservations/11111111-1111-4111-8111-111111111111/release
                traceId: 11111111-1111-4111-8111-111111111111
        '409':
          description: Конфликт состояния или Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/409
                title: Конфликт состояния или Idempotency-Key
                status: 409
                detail: Конфликт состояния или Idempotency-Key
                instance: /internal/v1/reservations/11111111-1111-4111-8111-111111111111/release
                traceId: 11111111-1111-4111-8111-111111111111
        '503':
          description: Сервис временно недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/503
                title: Сервис временно недоступен
                status: 503
                detail: Сервис временно недоступен
                instance: /internal/v1/reservations/11111111-1111-4111-8111-111111111111/release
                traceId: 11111111-1111-4111-8111-111111111111
      servers:
      - url: http://resource-service:8000
        description: Закрытая сеть сервисов
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateTeam:
      type: object
      additionalProperties: false
      required:
      - name
      - capability
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        capability:
          type: string
          enum:
          - GAS
          - WATER
          - RESCUE
      example: *id003
    Team:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - capability
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        capability:
          type: string
          enum:
          - GAS
          - WATER
          - RESCUE
      example: *id001
    ReserveTeam:
      type: object
      additionalProperties: false
      required:
      - teamId
      - dispatchId
      properties:
        teamId:
          type: string
          format: uuid
        dispatchId:
          type: string
          format: uuid
      example: *id004
    Reservation:
      type: object
      additionalProperties: false
      required:
      - dispatchId
      - teamId
      - status
      - createdAt
      properties:
        dispatchId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - HELD
          - CONFIRMED
          - RELEASED
        createdAt:
          type: string
          format: date-time
      example: *id002
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          format: uuid
      example:
        type: https://example.com/problems/conflict
        title: Конфликт состояния
        status: 409
        detail: Переход из текущего состояния запрещён
        instance: /api/v1/dispatches/11111111-1111-4111-8111-111111111111
        traceId: 11111111-1111-4111-8111-111111111111
    TeamList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
