                status: 503
                detail: Сервис временно недоступен
                instance: /api/v1/teams
                traceId: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeam'
            example: &id003
              name: Учебная бригада 1
              capability: GAS
    get:
      tags:
      - public
      operationId: listTeams
      summary: Получить бригады
      description: Роль dispatcher или resource-admin. Список не гарантирует доступность
        при последующем резервировании.
      parameters:
      - name: page
        in: query
        description: Номер страницы
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: size
        in: query
        description: Размер страницы
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
