openapi: 3.0.3
info:
  title: resource-service
  version: 1.0.0
  description: Контракт учебной системы City Response. Public — только через Gateway;
    internal — только service JWT. Ошибки application/problem+json. См. README для
    саги и политик повторов.
servers:
- url: http://localhost:8080
  description: Учебный API Gateway; внутренние маршруты здесь закрыты
tags:
- name: public
  description: Клиентский API через Gateway
- name: internal
  description: Межсервисный API в закрытой сети
security:
- bearerAuth: []
paths:
  /api/v1/teams:
    post:
      tags:
      - public
      operationId: createTeam
      summary: Добавить бригаду с закреплённым комплектом техники
      description: Роль resource-admin. В MVP комплект техники неделим и выделяется
        вместе с бригадой.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID операции. Ключ связан с caller, method, path и хэшем тела;
          другое тело с тем же ключом → 409. Хранить ответ минимум 7 суток; бизнес-уникальность
          dispatchId бессрочна.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '201':
          description: Успешный результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              example: &id001
                id: 11111111-1111-4111-8111-111111111111
                name: Учебная бригада 1
                capability: GAS
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/400
                title: Некорректный запрос
                status: 400
                detail: Некорректный запрос
                instance: /api/v1/teams
                traceId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Требуется авторизация
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/401
                title: Требуется авторизация
                status: 401
                detail: Требуется авторизация
                instance: /api/v1/teams
                traceId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Недостаточно прав
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/403
                title: Недостаточно прав
                status: 403
                detail: Недостаточно прав
                instance: /api/v1/teams
                traceId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Объект не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/404
                title: Объект не найден
                status: 404
                detail: Объект не найден
                instance: /api/v1/teams
                traceId: 11111111-1111-4111-8111-111111111111
        '409':
          description: Конфликт состояния или Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/problems/409
                title: Конфликт состояния или Idempotency-Key
                status: 409
                detail: Конфликт состояния или Idempotency-Key
                instance: /api/v1/teams
                traceId: 11111111-1111-4111-8111-111111111111
        '503':
          description: Сервис временно недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
